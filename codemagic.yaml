workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Pregame
    environment:
      node: 22
      xcode: latest
      # Variable group `smash` (shared with Squishy Smash) supplies
      # CERTIFICATE_PRIVATE_KEY — the RSA private key the codemagic-cli-tools
      # auto-signing flow uses to fetch or create the App Store distribution
      # certificate via the Pregame ASC API integration.
      groups:
        - smash
      vars:
        BUNDLE_ID: "com.athletedomains.ragesmash"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npm run build
      - name: Swap landing page for game page (native app)
        script: |
          cp dist/play/index.html dist/index.html
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch signing files (creates cert + profile if missing)
        # --create lets the ASC API auto-create both the distribution
        # certificate (using CERTIFICATE_PRIVATE_KEY) and the App Store
        # provisioning profile when they don't already exist. This is the
        # recovery path for "no matching profiles found" — replaces the
        # legacy ios_signing: block which depended on team-level certs
        # uploaded to Codemagic's signing-identities tab.
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply Xcode provisioning profiles
        script: xcode-project use-profiles
      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-build:
    name: Android Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 22
      java: 17
      groups:
        - android_signing  # Configure in Codemagic UI
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          npm run build
      - name: Swap landing page for game page (native app)
        script: |
          cp dist/play/index.html dist/index.html
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleRelease
      - name: Build Android AAB (for Play Store)
        script: |
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
